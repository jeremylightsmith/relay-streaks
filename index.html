<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Streaks</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 0 auto; padding: 1rem; }
      form { display: flex; gap: 0.5rem; }
      input { flex: 1; font-size: 1rem; padding: 0.5rem; }
      button { font-size: 1rem; padding: 0.5rem 1rem; }
      #error { color: #b00020; min-height: 1.2em; }
      ul { list-style: none; padding: 0; }
      li { padding: 0.25rem 0; }
      .habit {
        display: flex; align-items: center; gap: 0.75rem;
        width: 100%; min-height: 44px; text-align: left;
        background: none; border: 1px solid #ddd; border-radius: 0.5rem; cursor: pointer;
      }
      .check {
        display: inline-flex; align-items: center; justify-content: center; flex: none;
        width: 1.25rem; height: 1.25rem; border: 2px solid #888; border-radius: 0.25rem;
      }
      .habit[aria-pressed="true"] .name { color: #888; text-decoration: line-through; }
    </style>
  </head>
  <body>
    <h1>Streaks</h1>
    <h2 id="today-date"></h2>
    <form id="add-habit">
      <input id="habit-name" placeholder="New habit" required>
      <button type="submit">Add</button>
    </form>
    <p id="error" role="alert"></p>
    <ul id="today"></ul>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
